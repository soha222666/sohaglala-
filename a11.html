<html lang="ar" dir="rtl">
<head>
    <title>استمارة سفر سويسرا</title>
    <meta charset="UTF-8">
</head>
<body>

    <h2>استمارة التقديم لرحلة تركيا✈📄</h2>

    <form method="post" enctype="text/plain">

        الاسم الأول:
        <input type="text" name="firstname"  size="20" maxlength="15" placeholder="ادخل الاسم الأول"><br><br>

        اسم الأب:
        <input type="text" name="fathername" size="20" maxlength="15" placeholder="ادخل اسم الأب"><br><br>
   رقم الهوية:
        <input type="password" name="fathername" size="20" maxlength="15" placeholder="ادخل رقم الهوية"><br><br>
رقم جواز السفر:
        <input type="password" name="fathername" size="20" maxlength="15" placeholder="ادخل رقم الجواز"><br><br>
        كلمة المرور:
        <input type="password" name="pass" maxlength="12"><br><br>

        <input type="hidden" name="code" value="123">

        الجنس:
        <input type="radio" name="sex" value="female" checked> أنثى
        <input type="radio" name="sex" value="male"> ذكر<br><br>

        الأنشطة المفضلة في تركيا:
<br>
        <input type="checkbox" name="act1" value="nature" checked> زيارة الأرياف
        <input type="checkbox" name="act2" value="mountains"> صعود الجبال
        <input type="checkbox" name="act3" value="mountains"> ركوب الخيل<br><br>
        تحميل الملف:
        <input type="file" name="file1"><br><br>

       المدينة المقدم اليها الرحلة:
        <select name="city">
            <option value="interlaken">إسطنبول</option>
            <option value="zurich">طرابزون</option>
<option value="lucerne">انقرة</option>
<option value="geneva">عروس البحر</option>
        </select><br><br>

   
        <input type="submit" value="submit"> <br> <br>   

    </form>

<a href="index.html"> اضـغـط هـنـا للـعـودة الـــى الـصـفـحـة الـرئـيـسـيـة</a>


</body>
</html>
